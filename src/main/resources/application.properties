# ==========================================
# Baozi Store API - configuracoes principais
# ==========================================
spring.application.name=baozi-store-api
server.port=8080

# ---------- Banco de dados H2 (em memoria) ----------
spring.datasource.url=jdbc:h2:mem:baozistore;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:baozistore | usuario: sa | senha em branco)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA / Hibernate ----------
# update: cria/atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Mostra a mensagem do erro no corpo da resposta (ex.: 404 - Cliente nao encontrado)
server.error.include-message=always
