# ==========================================
# Perfil alternativo: banco MySQL
# Para usar, execute a aplicacao com o perfil "mysql":
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# ou, na IDE, defina a variavel SPRING_PROFILES_ACTIVE=mysql
# Ajuste usuario e senha de acordo com a sua instalacao do MySQL.
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/baozistore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.h2.console.enabled=false
